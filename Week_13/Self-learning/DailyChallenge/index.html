<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>QUIZ GAME</title>
  </head>
  <body>
    <div class="quiz-body">
      <label for="question" class="question">Your question here</label><br />
      <input
        type="text"
        class="answer"
        placeholder="Type your answer here..."
      /><br />
      <button type="button" class="next-q">Next question >>></button>
      <script type="text/javascript" src="script.js"></script>
    </div>
    <div id="score">
      <h3 id="congr"></h3>
      <br />
      <h3>Do you wish to restart or finish?</h3>
      <br />
      <button type="button" id="restart">Restart</button>
      <button type="button" id="finish">Finish</button>
    </div>
  </body>
</html>
